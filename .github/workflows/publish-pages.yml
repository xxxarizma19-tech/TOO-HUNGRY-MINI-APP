name: Publish TOO HUNGRY

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_public_release:
        description: Confirm the approved public release of the game, chef image, and album tracks
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: too-hungry-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.confirm_public_release }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload approved game build
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v5.0.1
